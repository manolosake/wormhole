<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relativistic Wormhole - Realtime WebGL</title>
  <style>
    :root {
      --bg-0: #010208;
      --bg-1: #060f22;
      --panel: rgba(6, 13, 30, 0.72);
      --line: rgba(130, 200, 255, 0.34);
      --txt: #e3f3ff;
      --muted: #9cc4dd;
      --accent: #7de7ff;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 18% 8%, #16284d 0%, var(--bg-1) 45%, var(--bg-0) 100%);
      color: var(--txt);
      font-family: "Segoe UI", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }
    #main {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      width: min(460px, calc(100vw - 20px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      padding: 11px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      z-index: 5;
    }
    h1 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0.2px;
    }
    .sub {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.35;
    }
    .bar {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pill {
      border: 1px solid rgba(140, 210, 255, 0.4);
      color: #d3ecff;
      background: rgba(13, 28, 53, 0.66);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: border-color 120ms ease, color 120ms ease, transform 120ms ease;
    }
    .pill:hover { transform: translateY(-1px); }
    .pill.active {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 1px rgba(125, 231, 255, 0.35) inset;
    }
    .grid {
      margin-top: 9px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      font-size: 11px;
    }
    .box {
      border: 1px solid rgba(140, 205, 255, 0.2);
      border-radius: 9px;
      padding: 6px;
      background: rgba(11, 23, 44, 0.5);
    }
    .box strong {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: #f0fbff;
    }
    .row {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
      font-size: 11px;
      color: var(--muted);
    }
    input[type=range] {
      width: 100%;
      margin-top: 4px;
      accent-color: #78dfff;
    }
    #status {
      margin-top: 8px;
      font-size: 11px;
      color: #add8ee;
      line-height: 1.35;
    }
    @media (max-width: 940px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      #hud { width: min(94vw, 520px); }
      .grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<canvas id="main"></canvas>
<div id="hud">
  <h1>Relativistic Wormhole / White-Hole Simulation</h1>
  <div class="sub">WebGL2 volumetric raymarching + relativistic color shift + lensing. Drag on canvas to orbit camera.</div>
  <div class="bar" id="presetBar">
    <button class="pill" data-preset="mobile">mobile</button>
    <button class="pill" data-preset="tablet">tablet</button>
    <button class="pill active" data-preset="scientific">scientific</button>
    <button class="pill" data-preset="cinematic">cinematic</button>
    <button class="pill" id="resetViewBtn" type="button">reset view</button>
  </div>
  <div class="bar" id="modeBar">
    <button class="pill active" data-mode="live">live</button>
    <button class="pill" data-mode="cinematic">cinematic</button>
  </div>
  <div class="grid">
    <div class="box">FPS<strong id="fps">0</strong></div>
    <div class="box">Frame ms<strong id="frame">0</strong></div>
    <div class="box">Realism<strong id="realism">0</strong></div>
    <div class="box">Stability<strong id="stability">0</strong></div>
  </div>
  <div class="row"><label for="lensStrength">Lens Strength</label><output id="lensOut"></output></div>
  <input id="lensStrength" type="range" min="0.70" max="1.80" step="0.01" value="1.22" />
  <div class="row"><label for="beta">Relativistic Beta</label><output id="betaOut"></output></div>
  <input id="beta" type="range" min="0.05" max="0.65" step="0.01" value="0.34" />
  <div class="row"><label for="gravShift">Gravity Shift</label><output id="gravOut"></output></div>
  <input id="gravShift" type="range" min="0.40" max="2.40" step="0.01" value="1.20" />
  <div class="row"><label for="emission">White-hole Emission</label><output id="emitOut"></output></div>
  <input id="emission" type="range" min="0.60" max="2.40" step="0.01" value="1.45" />
  <div class="row"><label for="quality">Quality</label><output id="qualityOut"></output></div>
  <input id="quality" type="range" min="0.45" max="1.00" step="0.01" value="0.88" />
  <div class="row"><label for="exposure">Exposure</label><output id="exposureOut"></output></div>
  <input id="exposure" type="range" min="0.70" max="1.60" step="0.01" value="1.05" />
  <div id="status">initializing...</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('main');
  const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
  const statusEl = document.getElementById('status');

  const ids = ['lensStrength', 'beta', 'gravShift', 'emission', 'quality', 'exposure'];
  const els = Object.fromEntries(ids.map((k) => [k, document.getElementById(k)]));
  const outs = {
    lensStrength: lensOut,
    beta: betaOut,
    gravShift: gravOut,
    emission: emitOut,
    quality: qualityOut,
    exposure: exposureOut,
  };

  const ui = {
    fps: document.getElementById('fps'),
    frame: document.getElementById('frame'),
    realism: document.getElementById('realism'),
    stability: document.getElementById('stability'),
  };

  const defaultView = {
    camYaw: 0.22,
    camPitch: 0.28,
  };

  const state = {
    preset: 'scientific',
    renderMode: 'live',
    fpsAvg: 0,
    frameMs: 0,
    frameMsEma: 16.67,
    times: [],
    frameCount: 0,
    start: performance.now(),
    camYaw: defaultView.camYaw,
    camPitch: defaultView.camPitch,
    dragging: false,
    dragX: 0,
    dragY: 0,
    autoQuality: false,
    deterministicMode: true,
    resolutionScale: 1.0,
    raySteps: 72,
    liveTargetFps: 30,
    webgl2: !!gl,
  };

  function syncUI() {
    ids.forEach((k) => {
      const n = Number(els[k].value);
      outs[k].textContent = n.toFixed(2);
    });
  }

  function setRenderMode(mode) {
    const next = mode === 'cinematic' ? 'cinematic' : 'live';
    state.renderMode = next;
    if (next === 'cinematic') {
      state.resolutionScale = 1.0;
    } else if (state.resolutionScale < 0.9) {
      state.resolutionScale = 0.9;
    }
    document.querySelectorAll('#modeBar .pill[data-mode]').forEach((b) => b.classList.toggle('active', b.dataset.mode === next));
  }

  function setPreset(name) {
    const presets = {
      mobile:     { lensStrength: 1.00, beta: 0.22, gravShift: 0.90, emission: 1.00, quality: 0.55, exposure: 0.98 },
      tablet:     { lensStrength: 1.10, beta: 0.28, gravShift: 1.02, emission: 1.18, quality: 0.72, exposure: 1.02 },
      scientific: { lensStrength: 1.16, beta: 0.34, gravShift: 1.18, emission: 1.42, quality: 0.78, exposure: 1.02 },
      cinematic:  { lensStrength: 1.36, beta: 0.42, gravShift: 1.36, emission: 1.88, quality: 0.96, exposure: 1.14 },
    };
    const p = presets[name] || presets.scientific;
    state.preset = name;
    // Freeze dynamic quality behavior for reproducible scientific benchmarks.
    state.autoQuality = state.deterministicMode ? false : name !== 'scientific';
    Object.keys(p).forEach((k) => { els[k].value = String(p[k]); });
    if (name === 'cinematic') setRenderMode('cinematic');
    else if (name === 'scientific') setRenderMode('live');
    syncUI();
    document.querySelectorAll('#presetBar .pill[data-preset]').forEach((b) => b.classList.toggle('active', b.dataset.preset === name));
  }

  function estimateRaySteps() {
    const q = Math.max(0, Math.min(1, Number(els.quality.value)));
    if (state.renderMode === 'cinematic') {
      return Math.max(96, Math.min(128, Math.round(96 + q * 32)));
    }
    const scaleNorm = Math.max(0, Math.min(1, (state.resolutionScale - 0.78) / 0.22));
    return Math.max(56, Math.min(80, Math.round(56 + q * 18 + scaleNorm * 6)));
  }

  function adaptLivePerformance() {
    if (state.renderMode !== 'live') return;
    if (state.dragging) return;
    if (state.frameCount % 30 !== 0) return;
    const low = state.liveTargetFps - 1.0;
    const high = state.liveTargetFps + 6.0;
    if (state.fpsAvg < low && state.resolutionScale > 0.78) {
      state.resolutionScale = Math.max(0.78, state.resolutionScale - 0.03);
      resize();
    } else if (state.fpsAvg > high && state.resolutionScale < 1.0) {
      state.resolutionScale = Math.min(1.0, state.resolutionScale + 0.02);
      resize();
    }
  }

  function resetView() {
    state.camYaw = defaultView.camYaw;
    state.camPitch = defaultView.camPitch;
  }

  function realismCheck() {
    const lens = Number(els.lensStrength.value);
    const beta = Number(els.beta.value);
    const grav = Number(els.gravShift.value);
    const emission = Number(els.emission.value);
    const quality = Number(els.quality.value);

    const checks = {
      webgl2: !!gl,
      lensing_active: lens >= 0.75,
      redshift_blueshift_active: beta >= 0.10,
      gravity_field_active: grav >= 0.60,
      whitehole_emission_active: emission >= 0.85,
      volumetric_quality: quality >= 0.55,
    };

    const score =
      (checks.webgl2 ? 20 : 0) +
      (checks.lensing_active ? 16 : 0) +
      (checks.redshift_blueshift_active ? 16 : 0) +
      (checks.gravity_field_active ? 16 : 0) +
      (checks.whitehole_emission_active ? 16 : 0) +
      (checks.volumetric_quality ? 16 : 0);

    return { checks, score };
  }

  function updateMetrics(dt) {
    state.times.push(dt);
    if (state.times.length > 120) state.times.shift();
    const sorted = [...state.times].sort((a, b) => a - b);
    const median = sorted[Math.floor(sorted.length / 2)] || dt;
    state.frameMsEma = state.frameMsEma * 0.92 + median * 0.08;
    state.frameMs = state.frameMsEma;
    state.fpsAvg = 1000 / Math.max(1, state.frameMs);
    state.frameCount += 1;

    const rel = realismCheck();
    const stability = Math.max(0, Math.min(100, 100 - (state.frameMs - 8.0) * 2.7));

    ui.fps.textContent = state.fpsAvg.toFixed(2);
    ui.frame.textContent = state.frameMs.toFixed(2);
    ui.realism.textContent = String(rel.score);
    ui.stability.textContent = stability.toFixed(1);
    adaptLivePerformance();

    if (state.autoQuality && state.frameCount % 45 === 0 && state.preset !== 'cinematic' && !state.dragging) {
      const q = Number(els.quality.value);
      let nextQ = q;
      if (state.fpsAvg < 30 && q > 0.50) nextQ = Math.max(0.50, q - 0.03);
      else if (state.fpsAvg > 56 && q < 0.92) nextQ = Math.min(0.92, q + 0.02);
      if (Math.abs(nextQ - q) > 0.0001) {
        els.quality.value = nextQ.toFixed(2);
        outs.quality.textContent = Number(els.quality.value).toFixed(2);
        resize();
      }
    }

    window.__iterMetrics = {
      fpsAvg: Number(state.fpsAvg.toFixed(2)),
      frameMs: Number(state.frameMs.toFixed(2)),
      frameCount: state.frameCount,
      timestamp: new Date().toISOString(),
      preset: state.preset,
      renderMode: state.renderMode,
      resolutionScale: Number(state.resolutionScale.toFixed(3)),
      raySteps: state.raySteps,
      params: {
        lensStrength: Number(els.lensStrength.value),
        beta: Number(els.beta.value),
        gravShift: Number(els.gravShift.value),
        emission: Number(els.emission.value),
        quality: Number(els.quality.value),
        exposure: Number(els.exposure.value),
        deterministicMode: state.deterministicMode,
      },
      realismScore: rel.score,
      stabilityScore: Number(stability.toFixed(2)),
    };

    window.__iterEval = {
      timestamp: new Date().toISOString(),
      checks: rel.checks,
      realismScore: rel.score,
      guardrails_pass: Boolean(rel.checks.lensing_active && rel.checks.redshift_blueshift_active && rel.checks.whitehole_emission_active),
      live_target_met: state.renderMode !== 'live' ? null : state.fpsAvg >= state.liveTargetFps,
      desktop_scientific_met: state.preset !== 'scientific' ? null : state.fpsAvg >= state.liveTargetFps,
    };

    if (state.frameCount % 15 === 0) {
      const modeText = state.renderMode === 'live'
        ? `Mode live (${state.liveTargetFps} FPS target).`
        : 'Mode cinematic (max quality).';
      statusEl.textContent = `${modeText} Scale ${state.resolutionScale.toFixed(2)} | steps ${state.raySteps}. Drag to orbit. Use reset view (or press R) if needed.`;
    }
  }

  function resize() {
    const dprCap = 2.0;
    const qualityScale = 0.62 + Number(els.quality.value) * 0.30;
    const modeScale = state.renderMode === 'live' ? state.resolutionScale : 1.0;
    const dpr = Math.min(window.devicePixelRatio || 1, dprCap) * qualityScale * modeScale;
    const w = Math.max(2, Math.floor(window.innerWidth * dpr));
    const h = Math.max(2, Math.floor(window.innerHeight * dpr));
    canvas.width = w;
    canvas.height = h;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    if (gl) gl.viewport(0, 0, w, h);
  }

  if (!gl) {
    statusEl.textContent = 'WebGL2 not available; running deterministic 2D fallback.';
    const ctx2d = canvas.getContext('2d', { alpha: false });
    const seed = 1337;
    const stars = Array.from({ length: 220 }, (_, i) => {
      const a = (i * 16807 + seed) % 2147483647;
      const b = (i * 48271 + seed * 3) % 2147483647;
      return { x: (a % 10000) / 10000, y: (b % 10000) / 10000, p: (a % 628) / 100 };
    });
    function drawFallback(nowMs) {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w * 0.5;
      const cy = h * 0.52;
      const t = nowMs * 0.001;
      const lens = Number(els.lensStrength.value);
      const beta = Number(els.beta.value);
      const grav = Number(els.gravShift.value);
      const em = Number(els.emission.value);
      ctx2d.fillStyle = '#040812';
      ctx2d.fillRect(0, 0, w, h);
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        const x = (s.x * w + Math.sin(t * 0.25 + s.p) * 10 + w) % w;
        const y = (s.y * h + Math.cos(t * 0.17 + s.p) * 8 + h) % h;
        const dx = x - cx;
        const dy = y - cy;
        const r = Math.sqrt(dx * dx + dy * dy) + 1;
        const bend = lens * 80 / (r + 45);
        const bx = x - (dx / r) * bend;
        const by = y - (dy / r) * bend;
        const shift = Math.max(0.6, Math.min(1.7, 1 + beta * (dx / (r + 1)))) * Math.exp(-grav * 0.012);
        const rr = Math.min(255, 110 * (1 / shift) + em * 45);
        const gg = Math.min(255, 145 + em * 30);
        const bb = Math.min(255, 182 * shift + em * 20);
        ctx2d.fillStyle = `rgba(${rr | 0},${gg | 0},${bb | 0},0.9)`;
        ctx2d.fillRect(bx, by, 1.5, 1.5);
      }
      const rg = ctx2d.createRadialGradient(cx, cy, 8, cx, cy, 130);
      rg.addColorStop(0, `rgba(255,245,220,${0.45 + em * 0.1})`);
      rg.addColorStop(0.2, `rgba(255,190,130,${0.2 + em * 0.06})`);
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx2d.fillStyle = rg;
      ctx2d.beginPath();
      ctx2d.arc(cx, cy, 130, 0, Math.PI * 2);
      ctx2d.fill();
    }
    window.__iterCtl = {
      setParams(p) {
        Object.entries(p || {}).forEach(([k, v]) => {
          if (k === 'preset') setPreset(String(v));
          else if (k === 'renderMode') setRenderMode(String(v));
          else if (k === 'deterministicMode') state.deterministicMode = Boolean(v);
          else if (Object.prototype.hasOwnProperty.call(els, k)) {
            const raw = Number(v);
            if (Number.isFinite(raw)) {
              const min = Number(els[k].min);
              const max = Number(els[k].max);
              els[k].value = String(Math.max(min, Math.min(max, raw)));
            }
          }
        });
        syncUI();
        resize();
        return true;
      },
      getMetrics() { return JSON.parse(JSON.stringify(window.__iterMetrics || {})); },
      getEval() { return JSON.parse(JSON.stringify(window.__iterEval || {})); }
    };
    setPreset('scientific');
    syncUI();
    resize();
    let lastNoGl = performance.now();
    function fallbackLoop(now) {
      const dt = Math.min(40, Math.max(8, now - lastNoGl));
      lastNoGl = now;
      drawFallback(now);
      updateMetrics(dt);
      requestAnimationFrame(fallbackLoop);
    }
    requestAnimationFrame(fallbackLoop);
    return;
  }

  const vertexSrc = `#version 300 es
    precision highp float;
    const vec2 POS[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
    out vec2 vUv;
    void main() {
      vec2 p = POS[gl_VertexID];
      vUv = p * 0.5 + 0.5;
      gl_Position = vec4(p, 0.0, 1.0);
    }
  `;

  const fragmentSrc = `#version 300 es
    precision highp float;
    in vec2 vUv;
    out vec4 fragColor;

    uniform vec2 uResolution;
    uniform float uTime;
    uniform float uLensStrength;
    uniform float uBeta;
    uniform float uGravShift;
    uniform float uEmission;
    uniform float uQuality;
    uniform float uExposure;
    uniform vec2 uCamAngles;
    uniform int uRaySteps;
    uniform float uRenderMode;

    float hash13(vec3 p) {
      p = fract(p * 0.1031);
      p += dot(p, p.zyx + 31.32);
      return fract((p.x + p.y) * p.z);
    }

    vec3 aces(vec3 x) {
      const float a = 2.51;
      const float b = 0.03;
      const float c = 2.43;
      const float d = 0.59;
      const float e = 0.14;
      return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
    }

    mat3 cameraBasis(vec3 ro, vec3 ta) {
      vec3 ww = normalize(ta - ro);
      vec3 uu = normalize(cross(vec3(0.0, 1.0, 0.0), ww));
      vec3 vv = cross(ww, uu);
      return mat3(uu, vv, ww);
    }

    vec3 background(vec3 rd) {
      float h = clamp(rd.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 base = mix(vec3(0.005, 0.012, 0.034), vec3(0.032, 0.058, 0.126), h);

      float dustBand = exp(-pow(rd.y * 2.1, 2.0));
      float dust = 0.5 + 0.5 * sin(rd.x * 9.0 + rd.z * 7.0 + uTime * 0.015);
      base += vec3(0.034, 0.024, 0.048) * dustBand * dust * 0.55;

      vec3 id = floor(rd * 360.0);
      vec3 fr = fract(rd * 360.0) - 0.5;
      float star = smoothstep(0.09, 0.0, length(fr)) * step(0.9975, hash13(id));
      vec3 starCol = mix(vec3(0.62, 0.78, 1.00), vec3(1.00, 0.85, 0.58), hash13(id + 8.7));

      return base + starCol * star * 8.4;
    }

    mat2 rot2(float a) {
      float c = cos(a);
      float s = sin(a);
      return mat2(c, -s, s, c);
    }

    vec2 lensingField(vec2 q, float r, float a, float lensStrength, float t) {
      vec2 dir = q / max(r, 1e-4);
      vec2 tanDir = vec2(-dir.y, dir.x);
      float radial = lensStrength * 0.100 / (r * r + 0.020);
      float swirl = 0.004 * sin(a * 6.0 - t * 1.45) * exp(-r * 7.0);
      return q + dir * radial + tanDir * swirl;
    }

    vec3 accretionDisk(float r, float a, float ringRadius, float ringWidth) {
      float disk = exp(-pow((r - ringRadius) / ringWidth, 2.0));
      float rim = exp(-pow((r - ringRadius * 1.01) / (ringWidth * 0.43), 2.0));
      float nearSide = smoothstep(-0.72, 0.94, sin(a - 0.10));
      float modeMix = uRenderMode;
      float filamentLow = 0.5 + 0.5 * sin(a * 8.0 - uTime * 2.0 + r * 30.0);
      float filamentHi = 0.5 + 0.5 * sin(a * 15.0 - uTime * 3.4 + r * 56.0);
      float filaments = mix(filamentLow, filamentHi, modeMix);

      vec3 warm = vec3(1.62, 0.94, 0.42);
      vec3 cool = vec3(0.22, 0.62, 1.36);
      vec3 col = mix(cool, warm, nearSide);

      float dop = clamp(1.0 + uBeta * cos(a - 0.12), 0.54, 1.95);
      col *= vec3(pow(dop, 1.22), 1.0, pow(1.0 / dop, 1.14));

      vec3 energy = col * disk * (0.36 + 1.00 * nearSide) * (0.42 + 0.58 * filaments) * (0.50 + 0.58 * uEmission);
      energy *= mix(1.0, 1.22, modeMix);
      energy += vec3(1.00, 0.98, 0.90) * rim * (0.09 + 0.24 * nearSide) * mix(1.0, 1.35, modeMix);
      return energy;
    }

    vec3 throatVolume(float r, float a, float ringRadius, int raySteps) {
      float inner = max(0.0001, r / max(0.0001, ringRadius * 0.95));
      float depth = 1.0 / (inner + 0.10);
      float occlusion = exp(-pow(r / (ringRadius * 0.53), 2.7));

      vec3 accum = vec3(0.0);
      float trans = 1.0;
      float maxDepth = mix(3.8, 8.6, uRenderMode);
      float stepsInv = 1.0 / max(1.0, float(raySteps));
      for (int i = 0; i < 128; i++) {
        if (i >= raySteps) break;
        float fi = float(i) * stepsInv;
        float z = fi * maxDepth;
        float swirlA = sin(a * 5.0 + z * 4.8 - uTime * 2.3);
        float swirlB = sin(a * 9.0 - z * 3.2 + uTime * 1.4);
        float spinLive = clamp(0.5 + 0.25 * swirlA + 0.25 * swirlB, 0.0, 1.0);
        float spinCine = 0.5 + 0.5 * sin(z * 6.4 - uTime * 1.5 + inner * 2.4);
        float spin = mix(spinLive, spinCine, uRenderMode);
        float bandsBase = sin(z * 11.0 - uTime * 1.6 + inner * 3.0);
        float bandsHi = sin(z * 18.0 + uTime * 2.2 + inner * 5.0);
        float bandsLive = clamp(0.5 + 0.35 * bandsBase + 0.15 * bandsHi * uRenderMode, 0.0, 1.0);
        float bandsCine = 0.5 + 0.5 * sin(z * 8.2 + uTime * 1.1 + inner * 2.6);
        float bands = mix(bandsLive, bandsCine, uRenderMode * 0.75);
        float density = exp(-z * 0.72) * (0.46 + 0.54 * bands) * exp(-pow(inner, 1.28));
        vec3 col = mix(vec3(0.015, 0.032, 0.070), vec3(0.20, 0.44, 0.98), spin);
        float stepLen = maxDepth * stepsInv;
        float alpha = 1.0 - exp(-density * (1.8 + uEmission * 0.45) * stepLen);
        accum += trans * col * alpha;
        trans *= (1.0 - alpha);
        if (trans < 0.02) break;
      }
      accum *= (1.0 - occlusion * (0.86 + 0.10 * uGravShift));
      return accum;
    }

    vec3 composeWormhole(mat3 cam, vec2 uv, int raySteps) {
      vec2 center = mix(vec2(0.19, -0.01), vec2(0.16, -0.05), uRenderMode);
      vec2 p = uv - center;
      p = rot2(uCamAngles.x * 0.42) * p;

      float tiltLive = clamp(0.62 + 0.26 * cos(uCamAngles.y * 1.2), 0.52, 0.92);
      float tiltCine = clamp(0.42 + 0.12 * cos(uCamAngles.y + 0.4), 0.34, 0.62);
      float tilt = mix(tiltLive, tiltCine, uRenderMode);
      vec2 q = vec2(p.x, p.y / tilt);
      float r = length(q) + 1e-4;
      float a = atan(q.y, q.x);

      vec2 qLensed = lensingField(q, r, a, uLensStrength, uTime);
      vec2 uvBg = center + vec2(qLensed.x, qLensed.y * tilt);
      vec3 rdBg = normalize(cam * vec3(uvBg, 1.72));
      vec3 color = background(rdBg);

      float ringRadiusBase = mix(0.108, 0.148, clamp(uLensStrength / 1.8, 0.0, 1.0));
      float ringRadius = mix(ringRadiusBase, ringRadiusBase * 1.08 + 0.010, uRenderMode);
      float ringWidth = mix(0.032, 0.012, uQuality) * mix(1.0, 0.78, uRenderMode);

      vec3 diskEnergy = accretionDisk(r, a, ringRadius, ringWidth);
      vec3 throat = throatVolume(r, a, ringRadius, raySteps);
      float throatMask = exp(-pow(r / (ringRadius * 0.92), 1.55));
      color += diskEnergy;
      color = mix(color, throat + color * 0.45, throatMask * 0.62);

      vec2 dir = q / max(r, 1e-4);
      float mirrorR = ringRadius * ringRadius / (r + 0.030);
      vec2 qMirror = dir * mirrorR;
      vec2 uvMirror = center + vec2(qMirror.x, qMirror.y * tilt);
      vec3 lensCol = background(normalize(cam * vec3(uvMirror, 1.72)));
      float nearSide = smoothstep(-0.72, 0.94, sin(a - 0.10));
      float lensBand = exp(-pow((r - ringRadius * 0.80) / (ringWidth * 0.72), 2.0));
      color += lensCol * lensBand * (0.22 + 0.14 * (1.0 - nearSide));

      float photonRing = exp(-pow((r - ringRadius * 1.06) / 0.006, 2.0));
      float halo = exp(-pow((r - ringRadius * 1.24) / 0.034, 2.0));
      color += vec3(0.90, 0.98, 1.12) * photonRing * 0.18;
      color += vec3(0.16, 0.42, 0.94) * halo * 0.20;

      float dopplerArc = smoothstep(-0.2, 1.0, cos(a - 0.4));
      float shearBand = exp(-pow((r - ringRadius * 0.97) / (ringWidth * 0.65), 2.0));
      color += vec3(0.90, 0.64, 0.34) * shearBand * dopplerArc * 0.24 * uRenderMode;

      float cinematicArc = exp(-pow((r - ringRadius * 1.30) / 0.12, 2.0)) *
        (0.65 + 0.35 * sin(a * 4.0 + uTime * 0.8 + r * 6.0));
      color += vec3(0.20, 0.46, 1.04) * cinematicArc * 0.14 * uRenderMode;
      float cinematicCore = exp(-pow(r / (ringRadius * 0.28), 2.0));
      color += vec3(0.58, 0.82, 1.22) * cinematicCore * 0.18 * uRenderMode;

      return color;
    }

    void main() {
      vec2 frag = gl_FragCoord.xy;
      vec2 uv = (frag - 0.5 * uResolution) / uResolution.y;

      float yaw = uCamAngles.x + uTime * mix(0.048, 0.028, uRenderMode);
      float pitch = clamp(uCamAngles.y, -1.0, 1.0);
      float radius = mix(8.5, 6.8, uRenderMode);
      float height = mix(1.9, 3.0, uRenderMode);
      vec3 ro = vec3(cos(yaw) * radius, sin(pitch) * height, sin(yaw) * radius);
      mat3 cam = cameraBasis(ro, vec3(0.0));

      vec3 color = composeWormhole(cam, uv, uRaySteps);

      if (uQuality > 0.96 || uRenderMode > 0.5) {
        vec2 j = vec2(0.45, -0.30) / uResolution;
        vec3 color2 = composeWormhole(cam, uv + j, uRaySteps);
        color = mix(color, color2, 0.30);
        if (uRenderMode > 0.5) {
          vec2 j2 = vec2(-0.35, 0.22) / uResolution;
          vec3 color3 = composeWormhole(cam, uv + j2, uRaySteps);
          color = mix(color, color3, 0.25);
        }
      }

      color *= uExposure;
      color = aces(color);
      color = pow(color, vec3(0.4545));
      fragColor = vec4(color, 1.0);
    }
  `;

  function compile(type, src) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, src);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const info = gl.getShaderInfoLog(shader) || 'unknown shader error';
      gl.deleteShader(shader);
      throw new Error(info);
    }
    return shader;
  }

  function makeProgram(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      const info = gl.getProgramInfoLog(p) || 'unknown link error';
      gl.deleteProgram(p);
      throw new Error(info);
    }
    return p;
  }

  let program;
  try {
    const vs = compile(gl.VERTEX_SHADER, vertexSrc);
    const fs = compile(gl.FRAGMENT_SHADER, fragmentSrc);
    program = makeProgram(vs, fs);
    gl.deleteShader(vs);
    gl.deleteShader(fs);
  } catch (err) {
    statusEl.textContent = 'Shader compile error: ' + String(err.message || err);
    window.__iterMetrics = { fpsAvg: 0, frameMs: 0, frameCount: 0, timestamp: new Date().toISOString(), preset: state.preset, params: {}, realismScore: 0, stabilityScore: 0 };
    window.__iterEval = { timestamp: new Date().toISOString(), checks: { shader_compile: false }, realismScore: 0, guardrails_pass: false };
    return;
  }

  const uniforms = {
    res: gl.getUniformLocation(program, 'uResolution'),
    time: gl.getUniformLocation(program, 'uTime'),
    lens: gl.getUniformLocation(program, 'uLensStrength'),
    beta: gl.getUniformLocation(program, 'uBeta'),
    grav: gl.getUniformLocation(program, 'uGravShift'),
    emit: gl.getUniformLocation(program, 'uEmission'),
    quality: gl.getUniformLocation(program, 'uQuality'),
    exposure: gl.getUniformLocation(program, 'uExposure'),
    cam: gl.getUniformLocation(program, 'uCamAngles'),
    raySteps: gl.getUniformLocation(program, 'uRaySteps'),
    mode: gl.getUniformLocation(program, 'uRenderMode'),
  };

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  function draw(nowMs) {
    const t = (nowMs - state.start) * 0.001;
    state.raySteps = estimateRaySteps();
    gl.useProgram(program);
    gl.bindVertexArray(vao);

    gl.uniform2f(uniforms.res, canvas.width, canvas.height);
    gl.uniform1f(uniforms.time, t);
    gl.uniform1f(uniforms.lens, Number(els.lensStrength.value));
    gl.uniform1f(uniforms.beta, Number(els.beta.value));
    gl.uniform1f(uniforms.grav, Number(els.gravShift.value));
    gl.uniform1f(uniforms.emit, Number(els.emission.value));
    gl.uniform1f(uniforms.quality, Number(els.quality.value));
    gl.uniform1f(uniforms.exposure, Number(els.exposure.value));
    gl.uniform2f(uniforms.cam, state.camYaw, state.camPitch);
    gl.uniform1i(uniforms.raySteps, state.raySteps);
    gl.uniform1f(uniforms.mode, state.renderMode === 'cinematic' ? 1.0 : 0.0);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(40, Math.max(8, now - last));
    last = now;
    draw(now);
    updateMetrics(dt);
    requestAnimationFrame(loop);
  }

  function pointerDown(ev) {
    state.dragging = true;
    state.dragX = ev.clientX;
    state.dragY = ev.clientY;
    canvas.setPointerCapture(ev.pointerId);
  }

  function pointerMove(ev) {
    if (!state.dragging) return;
    const dx = ev.clientX - state.dragX;
    const dy = ev.clientY - state.dragY;
    state.dragX = ev.clientX;
    state.dragY = ev.clientY;
    state.camYaw += dx * 0.0045;
    state.camPitch = Math.max(-1.05, Math.min(1.05, state.camPitch + dy * 0.0038));
  }

  function pointerUp(ev) {
    state.dragging = false;
    try { canvas.releasePointerCapture(ev.pointerId); } catch (_e) {}
  }

  window.__iterCtl = {
    setParams(p) {
      Object.entries(p || {}).forEach(([k, v]) => {
        if (k === 'preset') {
          setPreset(String(v));
        } else if (k === 'renderMode') {
          setRenderMode(String(v));
        } else if (k === 'deterministicMode') {
          state.deterministicMode = Boolean(v);
          state.autoQuality = state.deterministicMode ? false : state.autoQuality;
        } else if (Object.prototype.hasOwnProperty.call(els, k)) {
          const raw = Number(v);
          if (Number.isFinite(raw)) {
            const min = Number(els[k].min);
            const max = Number(els[k].max);
            els[k].value = String(Math.max(min, Math.min(max, raw)));
          }
        }
      });
      syncUI();
      resize();
      return true;
    },
    getMetrics() {
      return JSON.parse(JSON.stringify(window.__iterMetrics || {}));
    },
    getEval() {
      return JSON.parse(JSON.stringify(window.__iterEval || {}));
    },
  };

  canvas.addEventListener('pointerdown', pointerDown);
  canvas.addEventListener('pointermove', pointerMove);
  canvas.addEventListener('pointerup', pointerUp);
  canvas.addEventListener('pointercancel', pointerUp);

  document.querySelectorAll('#presetBar .pill[data-preset]').forEach((btn) => {
    btn.addEventListener('click', () => {
      setPreset(btn.dataset.preset || 'scientific');
      resize();
    });
  });

  document.querySelectorAll('#modeBar .pill[data-mode]').forEach((btn) => {
    btn.addEventListener('click', () => {
      setRenderMode(btn.dataset.mode || 'live');
      resize();
    });
  });

  const resetViewBtn = document.getElementById('resetViewBtn');
  if (resetViewBtn) {
    resetViewBtn.addEventListener('click', () => {
      resetView();
    });
  }

  window.addEventListener('keydown', (ev) => {
    if (String(ev.key || '').toLowerCase() === 'r') {
      resetView();
    }
  });

  Object.values(els).forEach((el) => {
    el.addEventListener('input', () => {
      syncUI();
      if (el.id === 'quality') resize();
    });
  });

  window.addEventListener('resize', resize);

  setPreset('scientific');
  setRenderMode('live');
  syncUI();
  resize();
  window.__iterMetrics = {
    fpsAvg: 0, frameMs: 0, frameCount: 0, timestamp: new Date().toISOString(), preset: state.preset,
    renderMode: state.renderMode,
    resolutionScale: Number(state.resolutionScale.toFixed(3)),
    raySteps: state.raySteps,
    params: { lensStrength: Number(els.lensStrength.value), beta: Number(els.beta.value), gravShift: Number(els.gravShift.value), emission: Number(els.emission.value), quality: Number(els.quality.value), exposure: Number(els.exposure.value), deterministicMode: state.deterministicMode },
    realismScore: 0, stabilityScore: 0
  };
  window.__iterEval = {
    timestamp: new Date().toISOString(),
    checks: realismCheck().checks,
    realismScore: 0,
    guardrails_pass: false,
    live_target_met: null,
    desktop_scientific_met: null
  };
  statusEl.textContent = `Mode live (${state.liveTargetFps} FPS target). Scale ${state.resolutionScale.toFixed(2)} | steps ${state.raySteps}. Drag to orbit. Use reset view (or press R) if needed.`;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
